# On demand only: the macOS and Linux installers' stress series at full count
# (50-run signal series, 100+100 rollback bursts per platform). The default
# suite runs a few of each; this is the evidence run for a branch that changes
# installers/macos/dmg-install.command or installers/linux/bundle-install.sh.
name: Installer stress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: Installer stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      WG_STRESS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the system libraries gmsh links against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-lock.txt
          pip install --no-deps -r server/requirements-pins.txt
          pip install -r server/requirements-dev.txt
      - name: Installer stress series
        run: >-
          python scripts/run_tests.py -q -p no:cacheprovider
          scripts/tests/test_installer_review_followups.py
          scripts/tests/test_dmg_install_update.py
          scripts/tests/test_linux_bundle_install_update.py
