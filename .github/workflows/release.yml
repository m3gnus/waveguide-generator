name: Release

# Goal 6 of the rebuild plan: end users must not need a Node runtime. The SPA is
# therefore built here, once, and attached to the tagged release; the installer
# downloads that artifact instead of building from a clone. Nothing else about
# the app ships here -- the Python side comes from the tag itself, and the
# HornLab modules from the SHAs pinned in pins.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to"
        required: true

permissions:
  actions: read
  contents: write

jobs:
  spa:
    name: Build and attach the SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tag must match shared/version.json and belong to main
        id: release_guard
        # The version reaches the UI, /health and the update checker from this
        # one file. A tag that disagrees with it ships a build that misreports
        # itself, which is worse than a failed release.
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          declared="v$(python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          if [ "$tag" != "$declared" ]; then
            echo "Tag $tag does not match shared/version.json ($declared)." >&2
            exit 1
          fi
          if ! tagged_commit="$(git rev-parse --verify "$tag^{commit}")" \
             || [ "$(git rev-parse HEAD)" != "$tagged_commit" ]; then
            echo "$tag is not a tag for the checked-out commit." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "$tagged_commit is not reachable from origin/main." >&2
            exit 1
          fi
          echo "version=${declared#v}" >> "$GITHUB_ENV"
          echo "tagged_commit=$tagged_commit" >> "$GITHUB_OUTPUT"

      - name: Tagged commit must have successful CI
        uses: actions/github-script@v7
        env:
          TAGGED_COMMIT: ${{ steps.release_guard.outputs.tagged_commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              head_sha: process.env.TAGGED_COMMIT,
              event: "push",
              status: "completed",
              per_page: 100,
            });
            const successful = response.data.workflow_runs.some(
              (run) => run.conclusion === "success"
            );
            if (!successful) {
              core.setFailed(
                `CI has not completed successfully for ${process.env.TAGGED_COMMIT}.`
              );
            }

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          set -euo pipefail
          name="waveguide-generator-v2-spa-${{ env.version }}"
          tar -czf "$name.tar.gz" -C frontend dist
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "artifact=$name" >> "$GITHUB_ENV"
          # sed consumes the complete listing. With pipefail, `head` may close
          # the pipe early and turn a successful tar into SIGPIPE exit 141.
          tar -tzf "$name.tar.gz" | sed -n '1,5p'

      - name: Refuse to ship an empty bundle
        # A silently-successful build that produced no index.html would install
        # cleanly and then serve nothing.
        run: |
          set -euo pipefail
          # Do not use grep -q here: it can close the pipe on the first match
          # and make tar's otherwise-successful SIGPIPE fail the release step.
          tar -tzf "${{ env.artifact }}.tar.gz" | grep -Fx "dist/index.html"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ env.artifact }}.tar.gz
            ${{ env.artifact }}.tar.gz.sha256
          fail_on_unmatched_files: true
          body: |
            Waveguide Generator v${{ env.version }}.

            `${{ env.artifact }}.tar.gz` is the prebuilt SPA. The installer
            downloads it so that running Waveguide Generator needs no Node.js. Verify it against
            the accompanying `.sha256` before extracting over `frontend/dist`.
