name: Release

# Promote only the exact bytes from a successful, signed rc-build run on main.
# No builds or signing here: installed qualification and approval live there.
# Verify the source, complete inventory, checksums, signatures and same-run
# provenance before either release is written. Create the release tag last.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full release commit on main to tag and publish"
        required: true
      source_run_id:
        description: "Successful signed rc-build run qualifying these exact bytes"
        required: true

# Serialize across SHAs as well: two commits can declare the same version.
concurrency:
  group: release-promotion
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Verify and promote the qualified candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Verify the immutable dispatch source
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$RELEASE_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: The version must be unreleased and the commit must be on main
        id: release_guard
        # The version reaches the UI, /health and the update checker from
        # shared/version.json, so that file — not a tag someone typed — names
        # the release. The tag is created by the publish job at the end.
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          declared="$(python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          tag="v$declared"
          release_commit="$(git rev-parse --verify "$RELEASE_SHA^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$release_commit" ]; then
            echo "The checked-out commit is not $RELEASE_SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "$release_commit is not reachable from origin/main." >&2
            exit 1
          fi
          git fetch --tags --force origin
          if git rev-parse --verify --quiet "refs/tags/$tag^{}" >/dev/null; then
            echo "$tag already exists. A published version is immutable; bump instead." >&2
            exit 1
          fi
          # Semantic versions only move forward, including past the tags that
          # earlier failed builds spent -- and "forward" is SemVer precedence,
          # not a three-integer tuple. This guard carried its own parser that
          # split on dots and required every part to be digits, so it refused
          # `0.3.2-rc.1` outright while `shared/release_assets.py`, the native
          # version fields, the asset names and the updater's beta channel had
          # all been widened to carry exactly that. The publisher could not
          # publish what the product could already install. It reads the same
          # comparator now: one function decides both what may be published and
          # what may be offered, so the two cannot drift apart again.
          #
          # It writes the pre-release flag to GITHUB_OUTPUT itself rather than
          # printing it into a shell variable, so the classification the publish
          # job needs comes out of the same parse that admitted the version and
          # is never re-derived from a string in another job. Directly, not
          # through `$(...)`: bash tokenizes a command substitution before it
          # runs, and an apostrophe in a heredoc nested inside one is read as an
          # opening quote -- `unexpected EOF while looking for matching`, on a
          # line of Python comment.
          python - "$declared" <<'PY'
          import subprocess
          import os
          import sys

          from shared import release_assets

          declared = sys.argv[1]
          try:
              candidate = release_assets.version_precedence(declared)
          except ValueError as exc:
              raise SystemExit(f"shared/version.json does not name a release: {exc}")

          # A release candidate and a build stamp share SemVer's pre-release
          # slot, and only one of them is a release. `0.4.0-main.7` names a
          # build of `main` -- published, if ever, by its own workflow, as its
          # own immutable pre-release. docs/reference/UPDATE-CHANNELS.md states
          # that a main build can never go out through this workflow, and until
          # the parser was widened for release candidates that was true only
          # because the parser refused every hyphen. The identifier is what
          # tells the two apart now, so the guarantee is stated rather than
          # inherited from a narrowness that had to go.
          if release_assets.is_build_stamp(declared):
              raise SystemExit(
                  f"{declared} is a build stamp, not a release version. This "
                  "workflow publishes releases; a build of main is published by "
                  "its own workflow."
              )

          # `git tag --list v*` also returns the `-updates` companions, which
          # name another version's machinery and are not releases. The comparator
          # refuses them by name, so they filter themselves out here.
          published: list[tuple[tuple, str]] = []
          for name in subprocess.run(
              ["git", "tag", "--list", "v*"],
              capture_output=True, text=True, check=True,
          ).stdout.split():
              try:
                  published.append((release_assets.version_precedence(name), name))
              except ValueError:
                  continue
          if published:
              highest, highest_tag = max(published)
              if candidate <= highest:
                  raise SystemExit(
                      f"{declared} does not move forward past the highest tag {highest_tag}."
                  )

          # GIT-WORKFLOW.md section 4: the pre-release flag is what hides a build
          # from the stable channel. A pre-release published without it becomes
          # what /releases/latest returns and is offered to every stable install.
          flag = "true" if release_assets.is_prerelease(declared) else "false"
          print(f"{declared} is a pre-release: {flag}")
          destination = os.environ.get("GITHUB_OUTPUT")
          if destination:
              with open(destination, "a", encoding="utf-8") as handle:
                  handle.write(f"prerelease={flag}\n")
          PY
          echo "version=$declared" >> "$GITHUB_ENV"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "UPDATES_TAG=$tag-updates" >> "$GITHUB_ENV"

      - name: Require a successful signed candidate run on this source
        run: |
          set -euo pipefail
          python3 scripts/promote_candidate.py check-run --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" --expected-sha "$RELEASE_SHA" --out build/source-run.json

      - name: Download qualified spa artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-spa
          path: build/publish-inputs/spa
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download qualified macos artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-macos-sign-inputs
          path: build/publish-inputs/macos
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download qualified windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-windows-sign-inputs
          path: build/publish-inputs/windows
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download qualified linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-linux-sign-inputs
          path: build/publish-inputs/linux
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download qualified signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-signed-candidate
          path: build/signed-candidate
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify digests, signatures and same-run attestations before staging
        run: |
          set -euo pipefail
          python3 scripts/promote_candidate.py stage --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" --expected-sha "$RELEASE_SHA" \
            --version "${{ steps.release_guard.outputs.version }}" --source-run build/source-run.json \
            --root build/publish-inputs --signed build/signed-candidate \
            --downloads build/release-assets --updates build/update-assets

      - name: Verify existing releases before any publication
        id: publication
        run: |
          set -euo pipefail
          python3 scripts/promote_candidate.py check-publication --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" \
            --downloads build/release-assets --updates build/update-assets --out "$GITHUB_OUTPUT"

      - name: Publish supporting assets as a companion pre-release
        if: ${{ steps.publication.outputs.companion_exists == 'false' }}
        # Published BEFORE the user-facing release, so the SPA archive the
        # signed manifest names exists by the time anything can look. Flagged as a pre-release so it
        # is never "Latest" and is demoted in the releases list; the assets stay
        # in this repository, so trusted_asset_url keeps rejecting anything served
        # from elsewhere.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.UPDATES_TAG }}
          target_commitish: ${{ inputs.sha }}
          prerelease: true
          draft: false
          overwrite_files: false
          files: build/update-assets/*
          fail_on_unmatched_files: true
          name: "Supporting assets for ${{ env.RELEASE_TAG }}"
          body: |
            Prebuilt frontend and portable Windows archive for
            [${{ env.RELEASE_TAG }}](https://github.com/m3gnus/waveguide-generator/releases/tag/${{ env.RELEASE_TAG }}).
            Download the installer from that release for normal installation.

            `update-spa-*.tar.gz` and its checksum sidecar provide the prebuilt
            frontend for source installations.

            One file here is a real download, kept off the install page because it
            is the harder path and not the one to offer first:
            `Waveguide.Generator-${{ steps.release_guard.outputs.version }}-windows-x86_64.zip`
            is the portable Windows folder, for people who want a copy they can
            move rather than an install. Unblock the .zip **before** extracting it,
            and extract to a short path such as `C:\wg`.

      - name: Upload the validated inventory to a draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          # Derived from shared/version.json by the release guard, never from
          # whoever dispatched the workflow. `true` for `0.4.0-beta.1`, `false`
          # for `0.4.0`. This is the flag GIT-WORKFLOW.md section 4 calls the
          # thing that hides a build from the stable channel: without it a
          # candidate becomes what `/releases/latest` returns and every stable
          # install is offered it.
          #
          # Distinct from the companion above, which is unconditionally
          # `prerelease: true` because it carries machinery rather than a
          # release. Asserting "prerelease: true appears in this file" only ever
          # proved the companion was hidden, which is why this half was missing.
          prerelease: ${{ steps.release_guard.outputs.prerelease }}
          overwrite_files: true
          files: build/release-assets/*
          fail_on_unmatched_files: true
          body: |
            ## Install Waveguide Generator ${{ env.RELEASE_TAG }}

            Download **one** file:

            | Platform | File |
            |---|---|
            | macOS (Apple silicon) | `Waveguide.Generator-${{ steps.release_guard.outputs.version }}-macos-arm64.dmg` |
            | Windows (x86-64) | `Waveguide.Generator-${{ steps.release_guard.outputs.version }}-windows-x86_64-setup.exe` |
            | Linux (Ubuntu 24.04 LTS, x86-64) | `Waveguide.Generator-${{ steps.release_guard.outputs.version }}-linux-x86_64.tar.gz` |

            **macOS: drag the app out of the disk image to Applications, then open it.**
            macOS refuses it with "Apple could not verify ... is free of malware" -
            click **Done**, then go straight to **System Settings > Privacy & Security**,
            find the app under Security, and click **Open Anyway**. Once, not every
            launch. Copy it off the image before opening it: the mounted image is
            read-only, and the entry names the most recent block, so do not open
            anything else in between.

            `Install Waveguide Generator.command` in the disk image is an equivalent
            starting point, not a fallback: it is refused with the same wording and
            approved the same way, and it then copies the app to Applications, clears
            the download flag and starts it, so you drag nothing. Both routes were
            confirmed working on macOS 26.5.2.

            If Privacy & Security lists neither, drag the app to Applications and run
            this once instead:

            ```
            xattr -dr com.apple.quarantine "/Applications/Waveguide Generator.app"
            ```

            Both routes ship inside the disk image as `READ ME FIRST.txt`. Neither is a
            finding about the app; notarization needs a paid Apple Developer ID.

            **Windows: run the installer and click through one dialog.** It is unsigned,
            so the first run shows "Windows protected your PC" - click **More info**,
            then **Run anyway**. Like the macOS refusal above, that is a missing
            code-signing certificate, not a finding about the app. You see it once: the
            installer writes its payload itself, so nothing it installs carries the
            download mark, and the app never raises SmartScreen again.

            It installs to `%LOCALAPPDATA%\Programs` for the current user, with no
            elevation. That is deliberate rather than a limitation - the in-app updater
            replaces files in place and cannot elevate, so a Program Files install would
            break every later update. It also refuses an over-long install folder up
            front instead of failing partway through.

            **Linux: extract the `.tar.gz` and run `./install.sh` inside it.** No root, no
            package manager, nothing installed system-wide: it copies the application to
            `~/.local/share/waveguide-generator`, adds a menu entry and an icon, and puts
            `waveguide-generator` on your PATH. Run it again to upgrade in place, and
            `uninstall.sh` — kept next to the installed application — to remove it.
            Per-user is deliberate and is the same reason Windows installs to
            `%LOCALAPPDATA%`: the in-app updater replaces files inside the installation
            and cannot elevate, so a root-owned copy under `/opt` would never update.

            The tarball carries its own Python, its own Tcl/Tk and every Python package,
            but not the system OpenGL and X11 libraries the mesher loads at start. A
            desktop system already has them; `install.sh` checks first and stops with the
            exact command rather than installing something that cannot mesh. Linux gets
            the status window and your browser rather than the single native window; that
            is the documented behaviour on that platform, not a fault of this build.

            **This is Ubuntu 24.04 LTS on x86-64**, and distributions close enough to it —
            not "Linux". There is no arm64 Linux build and no musl build. Other
            distributions may well work; they are not what this was built and verified
            against.

            Prefer a portable copy? The `.zip` is still published, on
            [${{ env.UPDATES_TAG }}](https://github.com/m3gnus/waveguide-generator/releases/tag/${{ env.UPDATES_TAG }}) —
            off this page so there is one file per platform to choose from here, not
            two for Windows. Right-click it → Properties → tick **Unblock** before
            extracting, then extract to a short path such as `C:\wg`;
            `READ ME FIRST.txt` inside it explains both. The installer exists because
            doing neither by hand is the easier path.

            **Updating from 0.2.x is not possible in-app.** v0.2.2 to v0.2.4 published
            only the prebuilt frontend, with no application bundle, and v0.2.7 was
            withdrawn - so no installed copy has a path to this release. Install this
            one directly. From this version, **Install and restart** downloads the full
            installer, verifies its signed manifest and checksum, then closes WG,
            installs the update and restarts. Your saved data stays in place.

            **0.3.3-rc and earlier: download the installer.** Installed 0.3.4 and
            0.3.5 clients can use **Install and restart** with the signed full installer.

            <details><summary>Supporting assets</summary>

            The [companion release](https://github.com/m3gnus/waveguide-generator/releases/tag/${{ env.UPDATES_TAG }})
            holds only the prebuilt frontend archive, its checksum sidecar, and
            the portable Windows ZIP. Full-installer updates use the installers
            and signed manifest on this page.

            </details>

      - name: Create the annotated tag now that every asset exists
        # This is the step that spends the version, and it is deliberately the
        # last thing before publication. Everything that can fail - the source run, provenance, inventory and every
        # checksum - has already succeeded. A draft release does not create a
        # git ref, so an earlier failure leaves the version untouched and the
        # same number is retried.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Waveguide Generator $RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish only after every upload succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: The published tag must be the annotated one, on the release commit
        # Publishing a draft whose tag does not exist makes GitHub create a
        # LIGHTWEIGHT tag at target_commitish - the default branch's HEAD, not
        # necessarily this release's commit. So a skipped or failed tag step does
        # not fail the release; it silently ships a tag of the wrong kind and
        # possibly of the wrong commit. v0.2.3 in this repository is lightweight,
        # which is how that path is known to be reachable.
        #
        # Cheap to assert, and it is the last thing that can still be wrong once
        # the assets are known good.
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          kind="$(git cat-file -t "$(git rev-parse "$RELEASE_TAG")")"
          if [ "$kind" != "tag" ]; then
            echo "$RELEASE_TAG is a $kind, not an annotated tag object." >&2
            exit 1
          fi
          tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [ "$tagged" != "$RELEASE_SHA" ]; then
            echo "$RELEASE_TAG points at $tagged, not the release commit $RELEASE_SHA." >&2
            exit 1
          fi
          echo "$RELEASE_TAG is annotated and points at $RELEASE_SHA."
