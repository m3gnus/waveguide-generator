name: Release

# Build every release component BEFORE the version is spent. The tag does not
# exist when this workflow starts: the final job validates the exact asset
# inventory and checksums, uploads them to a draft, and only then creates the
# annotated tag and publishes.
#
# This ordering is the whole point. A tag push used to trigger this workflow, so
# the version was committed to before anything was known to build. Two failures
# of a gate that had never run permanently spent v0.2.5 and v0.2.6, because
# GIT-WORKFLOW.md section 4 keeps published tags immutable. With the tag created
# last, a failed build costs nothing and the same version is retried.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Release commit on main to build, tag and publish"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  spa:
    name: Build the SPA
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_guard.outputs.tag }}
      version: ${{ steps.release_guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: The version must be unreleased and the commit must be on main
        id: release_guard
        # The version reaches the UI, /health and the update checker from
        # shared/version.json, so that file — not a tag someone typed — names
        # the release. The tag is created by the publish job at the end.
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          declared="$(python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          tag="v$declared"
          release_commit="$(git rev-parse --verify "$RELEASE_SHA^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$release_commit" ]; then
            echo "The checked-out commit is not $RELEASE_SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "$release_commit is not reachable from origin/main." >&2
            exit 1
          fi
          git fetch --tags --force origin
          if git rev-parse --verify --quiet "refs/tags/$tag^{}" >/dev/null; then
            echo "$tag already exists. A version is never rebuilt; bump instead." >&2
            exit 1
          fi
          # Semantic versions only move forward, including past the tags that
          # earlier failed builds spent.
          python - "$declared" <<'PY'
          import subprocess
          import sys

          def parse(name: str) -> tuple[int, int, int] | None:
              parts = name[1:].split(".")
              if len(parts) != 3 or not all(p.isdigit() for p in parts):
                  return None
              return tuple(int(p) for p in parts)

          candidate = parse("v" + sys.argv[1])
          if candidate is None:
              raise SystemExit(f"shared/version.json is not MAJOR.MINOR.PATCH: {sys.argv[1]}")
          published = [
              version
              for version in (
                  parse(line)
                  for line in subprocess.run(
                      ["git", "tag", "--list", "v*"],
                      capture_output=True, text=True, check=True,
                  ).stdout.split()
              )
              if version is not None
          ]
          if published and candidate <= max(published):
              highest = ".".join(str(part) for part in max(published))
              raise SystemExit(
                  f"{sys.argv[1]} does not move forward past the highest tag v{highest}."
              )
          PY
          echo "version=$declared" >> "$GITHUB_ENV"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: The release commit must have successful CI
        uses: actions/github-script@v7
        env:
          RELEASE_COMMIT: ${{ steps.release_guard.outputs.release_commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              head_sha: process.env.RELEASE_COMMIT,
              event: "push",
              status: "completed",
              per_page: 100,
            });
            const successful = response.data.workflow_runs.some(
              (run) => run.conclusion === "success"
            );
            if (!successful) {
              core.setFailed(
                `CI has not completed successfully for ${process.env.RELEASE_COMMIT}.`
              );
            }

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package and verify the SPA
        run: |
          set -euo pipefail
          # spa_archive_name returns the COMPLETE filename, extension included.
          # The line this replaced held a stem and let the shell append .tar.gz,
          # and keeping that habit produced update-spa-<version>.tar.gz.tar.gz --
          # which the macOS job then could not find. Use the name as given.
          archive="$(python -c 'import sys; from shared import release_assets; print(release_assets.spa_archive_name(sys.argv[1]))' "${{ env.version }}")"
          tar -czf "$archive" -C frontend dist
          sha256sum "$archive" > "$archive.sha256"
          echo "artifact=$archive" >> "$GITHUB_ENV"
          tar -tzf "$archive" | sed -n '1,5p'
          # Do not use grep -q: closing the pipe early turns tar's success into
          # SIGPIPE under pipefail.
          tar -tzf "$archive" | grep -Fx "dist/index.html"

      - name: Share the SPA with bundle and publisher jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-spa
          path: |
            ${{ env.artifact }}
            ${{ env.artifact }}.sha256
          if-no-files-found: error

  macos-bundle:
    name: Build the macOS standalone app
    runs-on: macos-latest
    needs: spa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"

      - name: Download the verified SPA inputs
        uses: actions/download-artifact@v4
        with:
          name: release-spa
          path: build/spa

      - name: Build and verify the standalone app
        run: |
          set -euo pipefail
          version="$(uv run --no-project --python 3.13.12 python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          spa="build/spa/update-spa-$version.tar.gz"
          test -f "$spa"
          test -f "$spa.sha256"
          uv run --no-project --python 3.13.12 scripts/build_bundle.py --spa "$spa" --output build/bundle

      - name: Share the canonical platform-neutral app layer
        uses: actions/upload-artifact@v4
        with:
          name: standalone-app-layer
          path: |
            build/bundle/update-app-*.zip
            build/bundle/update-app-*.zip.sha256
            build/bundle/update-app-*.manifest.json
          if-no-files-found: error

      - name: Share the complete macOS release asset set
        uses: actions/upload-artifact@v4
        with:
          name: standalone-macos-assets
          path: |
            build/bundle/Waveguide.Generator-*-macos-arm64.dmg
            build/bundle/Waveguide.Generator-*-macos-arm64.dmg.sha256
            build/bundle/update-app-*.zip
            build/bundle/update-app-*.zip.sha256
            build/bundle/update-app-*.manifest.json
            build/bundle/update-app-*.manifest.json.sha256
            build/bundle/update-runtime-macos-arm64-*.zip
            build/bundle/update-runtime-macos-arm64-*.zip.sha256
          if-no-files-found: error

  windows-bundle:
    name: Build the Windows standalone app
    runs-on: windows-latest
    # The macOS job produces the canonical app archive. Waiting for it lets
    # Windows prove that its independently materialized Git blobs are exact.
    needs: [spa, macos-bundle]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"

      - name: Download the verified SPA inputs
        uses: actions/download-artifact@v4
        with:
          name: release-spa
          path: build/spa

      - name: Download the macOS-built app layer
        uses: actions/download-artifact@v4
        with:
          name: standalone-app-layer
          path: build/app-reference

      - name: Install the pinned Inno Setup
        shell: pwsh
        # Not part of the windows runner image, unlike most of what this job
        # uses. Pinned like uv and the actions above so a compiler update cannot
        # arrive unannounced in a release build; if the pin ever goes missing the
        # failure is loud and the fix is this one line.
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --version=6.7.1 -y --no-progress
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = (Get-ChildItem -Path "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1 -ExpandProperty FullName)
          }
          if (-not $iscc) { throw "Inno Setup installed but ISCC.exe was not found." }
          "WG2_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and verify the standalone app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = uv run --no-project --python 3.13.12 python -c 'import json; print(json.load(open("shared/version.json"))["version"])'
          $spa = "build/spa/update-spa-$version.tar.gz"
          if (-not (Test-Path -LiteralPath $spa) -or -not (Test-Path -LiteralPath "$spa.sha256")) {
            throw "The verified SPA inputs are missing."
          }
          uv run --no-project --python 3.13.12 python scripts/build_bundle.py --platform windows --spa $spa --output build/bundle

      - name: Assert both platforms built the same app layer
        shell: pwsh
        # The archives themselves are compressed and need not match byte for
        # byte; what must match is the content, which the manifest's treeSha256
        # covers - every path, its executable bit and its bytes. Comparing the
        # digest rather than the ZIP is what lets the layer stay compressed
        # without weakening the guarantee.
        run: |
          $ErrorActionPreference = "Stop"
          $local = @(Get-ChildItem -File build/bundle/update-app-*.manifest.json)
          $reference = @(Get-ChildItem -File build/app-reference/update-app-*.manifest.json)
          if ($local.Count -ne 1 -or $reference.Count -ne 1) {
            throw "Expected exactly one local and one macOS-built app manifest."
          }
          $localTree = (Get-Content -Raw $local[0] | ConvertFrom-Json).treeSha256
          $referenceTree = (Get-Content -Raw $reference[0] | ConvertFrom-Json).treeSha256
          if (-not $localTree -or -not $referenceTree) {
            throw "An app manifest carries no treeSha256; the builder did not write one."
          }
          if ($localTree -ne $referenceTree) {
            throw "Windows and macOS app layers differ: $localTree != $referenceTree"
          }
          Write-Host "Cross-platform app layer treeSha256: $localTree"

      - name: Share the complete Windows release asset set
        uses: actions/upload-artifact@v4
        with:
          name: standalone-windows-assets
          path: |
            build/bundle/Waveguide.Generator-*-windows-x86_64-setup.exe
            build/bundle/Waveguide.Generator-*-windows-x86_64-setup.exe.sha256
            build/bundle/Waveguide.Generator-*-windows-x86_64.zip
            build/bundle/Waveguide.Generator-*-windows-x86_64.zip.sha256
            build/bundle/update-runtime-windows-x86_64-*.zip
            build/bundle/update-runtime-windows-x86_64-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Validate and publish the complete release
    runs-on: ubuntu-latest
    needs: [spa, macos-bundle, windows-bundle]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.spa.outputs.tag }}
      UPDATES_TAG: ${{ needs.spa.outputs.tag }}-updates
      RELEASE_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Download SPA assets
        uses: actions/download-artifact@v4
        with:
          name: release-spa
          path: build/publish-inputs/spa

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: standalone-macos-assets
          path: build/publish-inputs/macos

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: standalone-windows-assets
          path: build/publish-inputs/windows

      - name: Validate the exact inventory and every checksum
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import re
          import shutil

          from shared import release_assets
          from shared.safe_names import collision_key, validate_relative_name

          root = Path("build/publish-inputs")
          destination = Path("build/release-assets")
          destination.mkdir()
          machinery = Path("build/update-assets")
          machinery.mkdir()
          version = json.loads(Path("shared/version.json").read_text(encoding="utf-8"))["version"]
          specs = (
              ("spa", re.escape(release_assets.spa_archive_name(version))),
              ("macos", re.escape(release_assets.installer_name(release_assets.MACOS_PLATFORM, version))),
              ("macos", re.escape(release_assets.app_layer_name(version))),
              ("macos", re.escape(release_assets.app_manifest_name(version))),
              ("macos", rf"{re.escape(release_assets.UPDATE_PREFIX)}-runtime-macos-arm64-[0-9a-f]{{12}}\.zip"),
              ("windows", re.escape(release_assets.windows_setup_name(version))),
              ("windows", re.escape(release_assets.installer_name(release_assets.WINDOWS_PLATFORM, version))),
              ("windows", rf"{re.escape(release_assets.UPDATE_PREFIX)}-runtime-windows-x86_64-[0-9a-f]{{12}}\.zip"),
          )
          expected_paths: set[Path] = set()
          public_keys: set[str] = set()
          for directory_name, pattern in specs:
              directory = root / directory_name
              matches = [
                  path
                  for path in directory.iterdir()
                  if path.is_file() and re.fullmatch(pattern, path.name)
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one {pattern!r} in {directory}, found {matches}"
                  )
              asset = matches[0]
              sidecar = asset.with_name(asset.name + ".sha256")
              if not sidecar.is_file():
                  raise SystemExit(f"Missing checksum sidecar for {asset.name}")
              name = validate_relative_name(asset.name, what="release asset")
              key = collision_key(name)
              if key in public_keys:
                  raise SystemExit(f"Release asset name collides: {name}")
              public_keys.add(key)
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              expected_line = f"{digest}  {asset.name}\n"
              if sidecar.read_text(encoding="ascii") != expected_line:
                  raise SystemExit(f"Invalid checksum sidecar for {asset.name}")
              expected_paths.update((asset, sidecar))
              # Two destinations: the release page a person lands on holds
              # exactly one file per platform, and everything else -- the update
              # layers, the SPA archive, and the portable Windows .zip -- goes to
              # the companion pre-release. Splitting here rather than at upload
              # time keeps one inventory check over both sets.
              target = (
                  destination
                  if release_assets.is_user_download(name, version)
                  else machinery
              )
              copies = [target]
              if target is machinery and release_assets.duplicate_on_user_release(
                  name, version
              ):
                  # TRANSITIONAL, and self-deleting: see
                  # release_assets.LAYER_DUPLICATION_VERSION. One version
                  # publishes the layers the release before it cannot otherwise
                  # reach -- it cannot see a `-updates` tag at all -- to both
                  # places. Removing it is this branch and nothing else, which is
                  # why the copying below is written once rather than per case.
                  copies.append(destination)
              # The sidecar is built and verified above; that is what proves the
              # artifact is what the builder thinks it is. Only the SPA's is
              # published. GitHub serves a per-asset digest and the updater reads
              # that, but scripts/fetch_spa.py fetches by URL for source installs
              # and never touches the releases API, so it still needs the file.
              keeps_sidecar = asset.name == release_assets.spa_archive_name(version)
              for into in copies:
                  shutil.copy2(asset, into / asset.name)
                  if keeps_sidecar:
                      shutil.copy2(sidecar, into / sidecar.name)

          actual_paths = {path for path in root.rglob("*") if path.is_file()}
          if actual_paths != expected_paths:
              missing = sorted(str(path) for path in expected_paths - actual_paths)
              extra = sorted(str(path) for path in actual_paths - expected_paths)
              raise SystemExit(f"Release inventory mismatch; missing={missing}, extra={extra}")
          downloads = sorted(path.name for path in destination.iterdir())
          layers = sorted(path.name for path in machinery.iterdir())
          expected_duplicates = sorted(
              name
              for name in layers
              if release_assets.duplicate_on_user_release(name, version)
          )
          # One file per asset, plus the single surviving sidecar -- not pairs.
          if len(downloads) + len(layers) != len(specs) + 1 + len(expected_duplicates):
              raise SystemExit(
                  f"Release staging did not produce exactly {len(specs)} assets and "
                  f"one sidecar (plus {len(expected_duplicates)} duplicated); "
                  f"downloads={downloads}, layers={layers}"
              )
          spa_sidecar = release_assets.checksum_name(
              release_assets.spa_archive_name(version)
          )
          stray_sidecars = sorted(
              name
              for name in downloads + layers
              if name.endswith(".sha256") and name != spa_sidecar
          )
          if stray_sidecars:
              raise SystemExit(
                  f"Unexpected checksum sidecars staged for publication: {stray_sidecars}"
              )
          # The split is asserted as an exact set, not assumed and not counted.
          # Counting would pass a release that staged the right number of files
          # into the wrong halves, and the failure mode of that is the one this
          # whole change exists to avoid: an updater pointed at a release with
          # nothing on it, or a user pointed at a page of machinery.
          wanted_downloads = sorted(
              [*release_assets.user_download_names(version), *expected_duplicates]
          )
          if downloads != wanted_downloads:
              strays = sorted(set(downloads) - set(wanted_downloads))
              missing_downloads = sorted(set(wanted_downloads) - set(downloads))
              raise SystemExit(
                  "The user-facing release must hold exactly "
                  f"{wanted_downloads}; unexpected={strays}, "
                  f"missing={missing_downloads}"
              )
          hidden = sorted(
              name for name in layers if release_assets.is_user_download(name, version)
          )
          if hidden:
              raise SystemExit(
                  f"Downloads hidden on the companion release: {hidden}"
              )
          if not downloads or not layers:
              raise SystemExit(
                  f"Release split is empty on one side; downloads={downloads}, "
                  f"layers={layers}"
              )
          print(
              f"Validated {len(specs)} release assets and one SPA sidecar: "
              f"{len(downloads) - len(expected_duplicates)} on the user-facing "
              f"release, {len(layers)} on the companion pre-release"
              + (
                  f", of which {expected_duplicates} are also published to the "
                  "user-facing release so the previous version can still update."
                  if expected_duplicates
                  else "."
              )
          )
          PY

      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$state" != "true" ]; then
              echo "Release $RELEASE_TAG is already public; refusing a non-atomic mutation." >&2
              exit 1
            fi
          fi

      - name: Publish the update layers as a companion pre-release
        # Published BEFORE the user-facing release, so the layers already exist
        # by the time anything can look for them. Flagged as a pre-release so it
        # is never "Latest" and is demoted in the releases list; the assets stay
        # in this repository, so trusted_asset_url keeps rejecting anything served
        # from elsewhere.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.UPDATES_TAG }}
          target_commitish: ${{ inputs.sha }}
          prerelease: true
          draft: false
          overwrite_files: true
          files: build/update-assets/*
          fail_on_unmatched_files: true
          name: "Update layers for ${{ env.RELEASE_TAG }}"
          body: |
            Machinery for the in-app updater. **This is not where you install from.**

            Install Waveguide Generator from
            [${{ env.RELEASE_TAG }}](https://github.com/m3gnus/waveguide-generator/releases/tag/${{ env.RELEASE_TAG }})
            instead — one file for macOS, one for Windows, and nothing else to choose between.

            The `update-` files exist so an update fetches only the layer that
            changed — usually about 4 MB rather than the whole application. The
            runtime layer is addressed by content, so releases that do not change
            the interpreter share one.

            One file here is a real download, kept off the install page because it
            is the harder path and not the one to offer first:
            `Waveguide.Generator-${{ needs.spa.outputs.version }}-windows-x86_64.zip`
            is the portable Windows folder, for people who want a copy they can
            move rather than an install. Unblock the .zip **before** extracting it,
            and extract to a short path such as `C:\wg`.

      - name: Upload the validated inventory to a draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          overwrite_files: true
          files: build/release-assets/*
          fail_on_unmatched_files: true
          body: |
            ## Install Waveguide Generator ${{ env.RELEASE_TAG }}

            Download **one** file:

            | Platform | File |
            |---|---|
            | macOS (Apple silicon) | `Waveguide.Generator-${{ needs.spa.outputs.version }}-macos-arm64.dmg` |
            | Windows (x86-64) | `Waveguide.Generator-${{ needs.spa.outputs.version }}-windows-x86_64-setup.exe` |

            **macOS: open the disk image and double-click `Install Waveguide Generator.command`.**
            macOS refuses it with "Apple could not verify ... is free of malware" -
            click **Done**, then go to **System Settings > Privacy & Security**, find
            the installer under Security, and click **Open Anyway**. It copies the app
            to Applications, clears the download flag and starts it. No Terminal.

            The app itself is refused with the same wording and *cannot* be approved
            that way: it is ad-hoc signed, which gives Gatekeeper no developer identity
            to attach an exception to, so Privacy & Security does not list it. A plain
            script is unsigned, which is a state macOS does offer an override for. That
            is the only difference between the two files.

            If the installer is not listed in Privacy & Security either, drag the app to
            Applications and run this once instead:

            ```
            xattr -dr com.apple.quarantine "/Applications/Waveguide Generator.app"
            ```

            Both routes ship inside the disk image as `READ ME FIRST.txt`. Neither is a
            finding about the app; notarization needs a paid Apple Developer ID.

            **Windows: run the installer and click through one dialog.** It is unsigned,
            so the first run shows "Windows protected your PC" - click **More info**,
            then **Run anyway**. Like the macOS refusal above, that is a missing
            code-signing certificate, not a finding about the app. You see it once: the
            installer writes its payload itself, so nothing it installs carries the
            download mark, and the app never raises SmartScreen again.

            It installs to `%LOCALAPPDATA%\Programs` for the current user, with no
            elevation. That is deliberate rather than a limitation - the in-app updater
            replaces files in place and cannot elevate, so a Program Files install would
            break every later update. It also refuses an over-long install folder up
            front instead of failing partway through.

            Prefer a portable copy? The `.zip` is still published, on
            [${{ env.UPDATES_TAG }}](https://github.com/m3gnus/waveguide-generator/releases/tag/${{ env.UPDATES_TAG }}) —
            off this page so there is one file per platform to choose from here, not
            two for Windows. Right-click it → Properties → tick **Unblock** before
            extracting, then extract to a short path such as `C:\wg`;
            `READ ME FIRST.txt` inside it explains both. The installer exists because
            doing neither by hand is the easier path.

            **Updating from 0.2.x is not possible in-app.** v0.2.2 to v0.2.4 published
            only the prebuilt frontend, with no application bundle, and v0.2.7 was
            withdrawn - so no installed copy has a path to this release. Install this
            one directly. From here on the in-app updater works normally: it downloads
            only the layer that changed, verifies its checksum, swaps it atomically, and
            on macOS re-signs and clears quarantine, so an update will not put you back
            behind the first-launch dialog.

            <details><summary>Where the in-app updater's files went</summary>

            This page holds one file per platform and nothing else. Everything
            named `update-…` is machinery, and it is published to
            [${{ env.UPDATES_TAG }}](https://github.com/m3gnus/waveguide-generator/releases/tag/${{ env.UPDATES_TAG }}),
            a pre-release you do not need to visit: `update-app-*.zip` and its
            manifest are the platform-neutral application layer;
            `update-runtime-*-<id>.zip` are the two runtime layers, addressed by
            content so releases that do not change the interpreter share one and
            the updater downloads only what moved; `update-spa-*.tar.gz` is the
            prebuilt frontend, so a source install needs no Node runtime.

            There is no Linux build. Linux installs from source — see the README.
            That `.tar.gz` is the frontend, not a Linux binary.

            </details>

      - name: Create the annotated tag now that every asset exists
        # This is the step that spends the version, and it is deliberately the
        # last thing before publication. Everything that can fail - all three
        # builds, the cross-platform app-layer digest, the inventory and every
        # checksum - has already succeeded. A draft release does not create a
        # git ref, so an earlier failure leaves the version untouched and the
        # same number is retried.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Waveguide Generator $RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish only after every upload succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: The published tag must be the annotated one, on the release commit
        # Publishing a draft whose tag does not exist makes GitHub create a
        # LIGHTWEIGHT tag at target_commitish - the default branch's HEAD, not
        # necessarily this release's commit. So a skipped or failed tag step does
        # not fail the release; it silently ships a tag of the wrong kind and
        # possibly of the wrong commit. v0.2.3 in this repository is lightweight,
        # which is how that path is known to be reachable.
        #
        # Cheap to assert, and it is the last thing that can still be wrong once
        # the assets are known good.
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          kind="$(git cat-file -t "$(git rev-parse "$RELEASE_TAG")")"
          if [ "$kind" != "tag" ]; then
            echo "$RELEASE_TAG is a $kind, not an annotated tag object." >&2
            exit 1
          fi
          tagged="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [ "$tagged" != "$RELEASE_SHA" ]; then
            echo "$RELEASE_TAG points at $tagged, not the release commit $RELEASE_SHA." >&2
            exit 1
          fi
          echo "$RELEASE_TAG is annotated and points at $RELEASE_SHA."
