name: CI

# Hosted CI never runs real solvers (WG-REBUILD-PLAN R2-P1.3): Metal and bempp
# parity live on the owned qualification runners, whose archived evidence the
# gates link to. What runs here is everything that is deterministic on a hosted
# runner -- suites, build, and the drift gates that keep generated files honest.

# `main` is the sole trunk (one-branch model, 2026-09-03): work lands there,
# betas are pre-release tags cut from it, and stable versions are full
# releases -- so the tag list, not a branch, is the release history. The old
# `next` integration branch is retired.
on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  shared-codec:
    name: Shared frame codec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The JS decoder and the Python encoder must agree on WS-PROTOCOL frames;
      # this suite is the only thing that pins both ends to the same fixtures.
      - name: Frame codec tests
        run: node --test shared/js/frame.test.mjs

  partial-merges:
    name: No branch merged short of its tip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Needs full history and every remote branch: the signal is where a
      # branch's merge base sits relative to main's first-parent chain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch every branch the check compares against
        run: git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
      # PR #29 shipped a capability's consumer without its enabler and broke
      # every default solve of 80 or more frequencies on main. Review and CI
      # both passed, because the test that catches it was on the unmerged tail.
      # The script resolves the upstream itself (`origin/next` while that
      # ref existed, `origin/main` since the one-branch model), so CI and a
      # hand-run agree. That
      # divergence was the bug: CI overrode the upstream while the script default
      # stayed `origin/main`, so running it by hand reported a branch fully merged
      # into `next` as partially merged.
      - name: Check for partially merged branches
        run: python scripts/check_partial_merges.py

  attribution:
    name: No AI attribution in new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # AGENTS.md and GIT-WORKFLOW.md 3 forbid crediting an assistant in the
      # history. That was enforced by asking, and two trailers reached published
      # branches on 2026-08-27 through reviewed pull requests, hours after the
      # rewrite that stripped the previous ones. The tooling adds them by
      # default, so the rule needs something that executes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch the base this branch is measured against
        run: git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
      - name: Check new commits for AI attribution
        env:
          # A pull request is measured against its own base; a push to trunk
          # against main itself, i.e. exactly the commits the push adds.
          BASE_REF: ${{ github.base_ref }}
        run: |
          upstream="origin/${BASE_REF:-main}"
          echo "checking ${upstream}..HEAD"
          python scripts/check_no_ai_attribution.py --upstream "$upstream"

  drift:
    name: Generated-file drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # requirements-pins.txt is generated from pins.json. A hand-edit here is
      # how a consumer silently ends up on a different module build than the
      # manifest claims.
      - name: Pinned requirements match pins.json
        run: python scripts/gen_requirements.py --check
      # shared/version.json is what /health and the SPA report, but npm keeps
      # its own copies. A drifted lockfile still releases -- it just ships a
      # build that misreports itself to npm ls and to any SBOM built from it.
      - name: Declared versions agree
        run: python scripts/bump_version.py --check
      - name: Lint
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check server scripts shared launch launchers

  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows has hung here on a blocking Win32 dialog: the suite stops
    # making progress but the process never exits, so without a cap the job
    # sits at GitHub's 6-hour default and only dies when the next push
    # cancels it. Linux and macOS finish in 5-7 minutes; this leaves room
    # for a slow Windows runner and still fails a hang inside the hour.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Committed macOS launcher icon is reproducible
        if: runner.os == 'macOS'
        run: python launchers/macos/generate_icon.py --check
      # `create_app()` mounts frontend/dist as StaticFiles, and dist is
      # gitignored, so app-constructing server tests fail in a clean checkout
      # until the SPA exists. Releases hand users a prebuilt archive instead;
      # CI has Node, so it builds one.
      - name: Build the SPA the server mounts
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # gmsh links its OCC kernel against libGLU, which the hosted Ubuntu image
      # does not carry. Without it `import gmsh` raises and every test that
      # builds a mesh fails on Linux alone -- which is invisible until this
      # workflow actually runs, as it had never done before 2026-08-09.
      - name: Install the system libraries gmsh links against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-lock.txt
          pip install --no-deps -r server/requirements-pins.txt
          pip install -r server/requirements-dev.txt
      - name: Server tests
        # -v, not -q: Linux has been dying mid-run with exit 141 (SIGPIPE) and
        # no summary, so the only way to name the test that takes the process
        # down is to have pytest print each one as it starts. Collection order
        # is already deterministic -- no ordering plugin is installed.
        run: python -m pytest server/tests scripts/tests -v
