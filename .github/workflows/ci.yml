name: CI

# Hosted CI runs no solver qualification (WG-REBUILD-PLAN R2-P1.3): Metal and
# bempp parity live on the owned qualification runners, whose archived evidence
# the gates link to. What runs here is everything that is deterministic on a
# hosted runner -- suites, build, and the drift gates that keep generated files
# honest. The only real solves are server/tests/test_real_pipeline.py: a
# two-frequency BEMPP smoke test of the whole pipeline on the pinned modules,
# and a CAD-return variant required on Ubuntu with pinned CPU OpenCL (PoCL).
# Other platforms run the CAD variant only where an imported engine is offered.

# Routine merges use affected local checks under workspace policy section 3.1;
# the full suite runs at dev checkpoints and on release candidates. Hosted CI
# is not a landing gate. It runs in three ways:
#
# - on every push to `dev`, which is where a landed batch arrives one step
#   before `main`: a diagnostic on the integration candidate. A push runs Linux
#   and Windows only (below); a pull request or a push to any other branch
#   still runs nothing;
# - on demand, on any ref: `gh workflow run ci.yml --ref <ref>`, which runs
#   the full matrix including macOS;
# - as source qualification, when release.yml or rc-build.yml calls it on the
#   exact commit it is about to build, again the full matrix. Their build jobs
#   need the calling job, so a red qualification builds, attests and publishes
#   nothing.
#
# A called run uses this file as it stands at the caller's commit, and its
# token holds only what the calling job grants, `contents: read` -- all that any
# job here needs. It publishes no release artifacts either way.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      installer_gate_run:
        description: "Replay installer gates using the retained failed setup from this RC run (diagnosis only)"
        type: string
        required: false
        default: ""
  workflow_call:

# Only a push is ever cancelled, and only by a newer push to the same ref: a
# superseded dev candidate is not worth a runner. Under workflow_call
# `github.workflow` is the caller's, so the group never uses it, and every
# non-push run gets a group of its own (its run id), so a dispatch or a release
# qualification is never cancelled by, and never cancels, another run.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  shared-codec:
    name: Shared frame codec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # The JS decoder and the Python encoder must agree on WS-PROTOCOL frames;
      # this suite is the only thing that pins both ends to the same fixtures.
      - name: Frame codec tests
        run: node --test shared/js/frame.test.mjs

  partial-merges:
    name: No branch merged short of its tip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Needs full history and every remote branch: the signal is where a
      # branch's merge base sits relative to main's first-parent chain.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Fetch every branch the check compares against
        run: git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
      # PR #29 shipped a capability's consumer without its enabler and broke
      # every default solve of 80 or more frequencies on main. Review and CI
      # both passed, because the test that catches it was on the unmerged tail.
      # The script resolves the upstream itself (`origin/next` while that
      # ref existed, `origin/main` since the one-branch model), so CI and a
      # hand-run agree. That
      # divergence was the bug: CI overrode the upstream while the script default
      # stayed `origin/main`, so running it by hand reported a branch fully merged
      # into `next` as partially merged.
      - name: Check for partially merged branches
        run: python scripts/check_partial_merges.py

  attribution:
    name: No AI attribution in new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # AGENTS.md and GIT-WORKFLOW.md 3 forbid crediting an assistant in the
      # history. That was enforced by asking, and two trailers reached published
      # branches on 2026-08-27 through reviewed pull requests, hours after the
      # rewrite that stripped the previous ones. The tooling adds them by
      # default, so the rule needs something that executes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Fetch the base this branch is measured against
        # Branches for a trunk or pull-request base, and the release tags that
        # --since-last-release measures from.
        run: |
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch --no-tags origin "+refs/tags/v*:refs/tags/v*"
      - name: Check new commits for AI attribution
        env:
          # A pull request is measured against its own base. A push is measured
          # against the commit the ref pointed at BEFORE it, which is the only
          # thing that names the commits the push adds.
          #
          # It used to be measured against `origin/${BASE_REF:-main}`, and on a
          # push that resolves to the commit just pushed: the checkout IS
          # origin/main, so `origin/main..HEAD` was empty and the gate reported
          # success over a batch whose messages it never read. An empty range is
          # indistinguishable from a clean branch in the output, which is why it
          # survived. The script prints the range it actually used.
          #
          # Neither event starts this workflow now. A dispatch names no base,
          # and a call from release.yml or rc-build.yml reports the caller's
          # workflow_dispatch; a release commit is ON main, so the trunk range
          # would be empty for the same reason. --since-last-release measures
          # those runs from the last release tag before HEAD instead, so
          # qualification reads every commit the release carries. A push or
          # pull request would still be measured against its own base.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python scripts/check_no_ai_attribution.py \
            --event "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --before "$BEFORE_SHA" \
            --since-last-release

  drift:
    name: Generated-file drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # requirements-pins.txt is generated from pins.json. A hand-edit here is
      # how a consumer silently ends up on a different module build than the
      # manifest claims.
      - name: Pinned requirements match pins.json
        run: python scripts/gen_requirements.py --check
      # shared/version.json is what /health and the SPA report, but npm keeps
      # its own copies. A drifted lockfile still releases -- it just ships a
      # build that misreports itself to npm ls and to any SBOM built from it.
      - name: Declared versions agree
        run: python scripts/bump_version.py --check
      - name: Lint
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt
          ruff check server scripts shared launch launchers
      - name: Server import boundaries
        run: lint-imports --no-cache

  windows-installer-compile:
    # Compile only: ISCC on the real bundle-setup.iss with a stub payload.
    # The .iss is only ever compiled on Windows, so this is the one place a
    # change it refuses is caught before a release build. Adds about a minute.
    name: Windows installer compiles
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey Inno Setup install exited $LASTEXITCODE"
          }
          $iscc = & ./scripts/ci/verify_inno_setup.ps1
          "WG2_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile the installer script against a stub payload
        shell: pwsh
        run: ./scripts/ci/compile_inno_stub.ps1 -CompilerPath $env:WG2_ISCC

  server:
    name: ${{ matrix.label }} (${{ matrix.os }})
    # The Linux server's CPU ICD below is pinned to Ubuntu 24.04 packages.
    # Keep the matrix label stable, but do not let ubuntu-latest move that host.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && matrix.suite == 'server' && 'ubuntu-24.04' || matrix.os }}
    # Two suites, two budgets, because they exhaust a budget differently.
    #
    # Windows has hung here on a blocking Win32 dialog: the suite stops making
    # progress but the process never exits, so without a cap the job sits at
    # GitHub's 6-hour default. The
    # detector for that is pytest.ini's faulthandler_timeout=300 with
    # faulthandler_exit_on_timeout, which names the blocked frame and kills the
    # run after five minutes on any single test. This job cap is the backstop
    # behind that detector, not the detector, so it can carry real margin and
    # still fail a hang well inside the hour.
    #
    # Measured on the last green run (34099268979, 2026-09-07) -- pytest wall
    # time, which excludes the 2-3m of setup above it:
    #
    #               server/tests   scripts/tests
    #   ubuntu           14.4m           0.7m
    #   macos            13.7m           8.6m
    #   windows          18.8m           0.5m
    #
    # Both suites ran in one job under a single 25m cap until run 34109392034
    # was cancelled at 25m20s on macOS -- one second past the green run before
    # it. That is exhaustion, not a flake, and re-running it would not have
    # fixed anything.
    #
    # scripts/tests costs 12-17x more on the macOS runner than on either other
    # platform. All of it is in test_qualify_installed_cpu.py's 13 stub-harness
    # tests, at ~35s each there against ~2s both locally and on Linux -- a
    # near-constant added per test rather than more work being done. Windows
    # skips exactly those 13 (the stub interpreter is a shebang script). That
    # cause is not diagnosed, and this split does not fix it: it stops one file
    # on one platform from setting the budget for the product suite.
    #
    # Windows server is the exception: it sat at ~21m including setup on
    # 2026-09-15 (pytest 19.0m, 3882 tests), took 30.6m on 2026-09-22 (4624
    # tests) and 34.4m on 2026-09-28 (run 36498497078, 4893 tests), i.e. 36.7
    # to 38.8m per job with setup. Run 36500433825 was cut off at the old 40m
    # cap at 97% with no hang. It was capped at 60m; RC run 38144034409 on
    # 2026-10-11 was then cut off at 60m at 93% (the previous green RC took
    # 57.7m), so it is capped at 80m. The heaviest files (test_exports_sizing,
    # test_general_horn_sources, the real BEMPP/field-plane/pipeline tests) are
    # the place to win time back; every other job keeps matrix.budget.
    #
    # macOS harness is the other exception. On main (run 36940318262,
    # 2026-10-01) it already took 18m of the 25m budget, about 14m of it
    # test_qualify_installed_cpu.py; the installer scripts' tests added about
    # 7m more on hosted macOS (run of 770e7e9e, 2026-10-02: their default
    # sample, one case per function there). It is capped at 40m. Bringing
    # test_qualify_installed_cpu.py down is a separate follow-up.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.suite == 'server' && 80 || (matrix.os == 'macos-latest' && matrix.suite == 'harness' && 40 || matrix.budget) }}
    strategy:
      fail-fast: false
      matrix:
        # A push to dev skips macOS. It is the slowest leg (its harness suite
        # runs 12-17x slower, see above) and the only macOS-only check is the
        # committed launcher icon; dispatch and release qualification keep
        # all three platforms.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        suite: [server, harness]
        include:
          - suite: server
            label: Server
            paths: server/tests
            # Windows, the slowest, sat at ~21m including setup on 2026-09-15
            # (pytest 19.0m, 3882 tests), 30.6m on 2026-09-22 (4624 tests) and
            # 34.4m on 2026-09-28 (run 36498497078, 4893 tests), which is 36.7
            # to 38.8m per job once setup is added. Run 36500433825 was cut off
            # at the old 40m cap at 97% with no hang. Ubuntu and macOS took
            # 26.2m and 22.2m of pytest in that run. A single per-OS number
            # is not possible here, so this 60m cap applies to all three; the
            # hang detector is faulthandler_timeout, not this backstop.
            budget: 60
          - suite: harness
            label: Harness
            paths: scripts/tests
            # Linux and Windows sit well inside this; macOS has its own 40m
            # cap above (measured 18m on main plus ~7m of installer tests).
            budget: 25
    # `test_frozen_installer_compatibility.py`, `test_cadlink_store_rollback.py`
    # (server/tests) and `test_frozen_installer_handoff.py` (scripts/tests) run
    # a previously *released* build's own code, extracted from its tag with
    # `git archive`, against the code under test. The bare
    # checkout above is shallow and fetches no tags, so without the step below
    # those tests silently skip -- WG_REQUIRE_RELEASE_TAGS turns that miss into
    # a failure instead, so a future checkout change cannot re-disable them
    # unnoticed. server/tests/_release_tags.py is the one place that lists the
    # tags; this step reads that same list rather than repeating it here.
    env:
      WG_REQUIRE_RELEASE_TAGS: "1"
      # Ubuntu's server job installs PoCL below, so a missing imported engine
      # must fail the pipeline test rather than silently skip the CAD path.
      WG_REQUIRE_IMPORTED_PIPELINE: ${{ matrix.os == 'ubuntu-latest' && matrix.suite == 'server' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The domain compatibility test loads a pre-M1c reader with git show.
          # A shallow checkout contains only this candidate and cannot read it.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fetch the release tags the frozen-release contract tests need
        # git-bash on windows-latest, not the default pwsh, so this one script
        # works identically on all three runners.
        shell: bash
        run: |
          set -euo pipefail
          tags=$(python -c "import sys; sys.path.insert(0, 'server/tests'); from _release_tags import RELEASE_TAGS; print(' '.join(RELEASE_TAGS))")
          for tag in $tags; do
            # --depth 1 on an explicit tag ref fetches only that commit and its
            # tree, not its ancestor history -- `git archive` reads a single
            # commit's tree, so that is already everything it needs.
            git fetch --no-tags --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          done
      - name: Committed macOS launcher icon is reproducible
        if: runner.os == 'macOS'
        run: python launchers/macos/generate_icon.py --check
      # `create_app()` mounts frontend/dist as StaticFiles, and dist is
      # gitignored, so app-constructing server tests fail in a clean checkout
      # until the SPA exists. Releases hand users a prebuilt archive instead;
      # CI has Node, so it builds one.
      #
      # The harness suite needs this too, for exactly one test --
      # scripts/tests/test_gen_openapi.py builds the live application to
      # compare the committed schema against it. Measured, not assumed: with
      # dist absent, scripts/tests is 304 passed and that one test failed.
      - name: Build the SPA the server mounts
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # gmsh links its OCC kernel against libGLU, which the hosted Ubuntu image
      # does not carry. Without it `import gmsh` raises and every test that
      # builds a mesh fails on Linux alone -- which is invisible until this
      # workflow actually runs, as it had never done before 2026-08-09.
      - name: Install the system libraries gmsh links against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/hash_lock_requirements.py --check
          pip install --require-hashes -r server/requirements-hashed.txt
          pip install --no-deps -r server/requirements-pins.txt
          pip install -r server/requirements-dev.txt
      - name: Check typed Python boundaries
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'server'
        run: python -m mypy
      # The 2022 PoCL 3.0 wheel failed on newer hosted EPYC CPUs with both an
      # unknown LLVM CPU target and missing compiled kernels. Use the pinned
      # distro CPU ICD instead; app dependencies and required CAD tests stay
      # unchanged. The real compute probe makes provisioning failures visible
      # before spending the full suite, and logs the actual CPU/driver facts.
      - name: Install the pinned CPU OpenCL runtime for the CAD pipeline
        if: runner.os == 'Linux' && matrix.suite == 'server'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pocl-opencl-icd=5.0-2.1build3
          dpkg-query -W pocl-opencl-icd libpocl2t64 libpocl2-common
          lscpu
          python - <<'PY'
          import json
          import pyopencl as cl
          from server.platform.temp_session import TemporarySession
          from server.solver.bempp_opencl import qualified_opencl

          for platform in cl.get_platforms():
              print(json.dumps({"platform": platform.name, "version": platform.version,
                                "devices": [{"name": device.name, "driver": device.driver_version,
                                             "version": device.version, "type": int(device.type)}
                                            for device in platform.get_devices()]}, sort_keys=True))
          session = TemporarySession.create()
          session.activate()
          try:
              verdict = qualified_opencl()
              print(json.dumps(verdict, sort_keys=True))
              if not verdict.get("ok") or verdict.get("device", {}).get("type") != "cpu":
                  raise SystemExit("The pinned CPU OpenCL runtime failed WG's real compute qualification")
          finally:
              session.close(remove=True)
          PY
      - name: ${{ matrix.label }} tests
        # -v, not -q: Linux has been dying mid-run with exit 141 (SIGPIPE) and
        # no summary, so the only way to name the test that takes the process
        # down is to have pytest print each one as it starts. Collection order
        # is already deterministic -- no ordering plugin is installed.
        #
        # --durations reports setup/call/teardown separately, which is the
        # split the macOS anomaly above needs and that -v timestamps cannot
        # give.
        run: python -m pytest ${{ matrix.paths }} -v --durations=25

  windows-installer-replay:
    name: Replay retained Windows installer gates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_gate_run != '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate and download the original diagnostic installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RUN: ${{ inputs.installer_gate_run }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:REPLAY_RUN -notmatch '^[0-9]+$') { throw "Expected a numeric RC run ID" }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REPLAY_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read the source run" }
          if (($run.path -split '@', 2)[0] -ne '.github/workflows/rc-build.yml') { throw "Expected an RC build run" }
          $changed = @(git diff --name-only $run.head_sha HEAD)
          if ($LASTEXITCODE -ne 0) { throw "Cannot compare installer source" }
          foreach ($path in $changed) {
            if ($path -ne 'installers/windows/gates.ps1' -and $path -ne '.github/workflows/ci.yml' -and $path -notlike 'scripts/tests/test_windows_*.py') {
              throw "Replay cannot qualify changed production input: $path"
            }
          }
          gh run download $env:REPLAY_RUN --repo $env:GITHUB_REPOSITORY --name rc-windows-setup-failure --dir replay-setup
          if ($LASTEXITCODE -ne 0) { throw "Cannot download diagnostic setup" }
          $setup = @(Get-ChildItem -File replay-setup/*-setup.exe)
          if ($setup.Count -ne 1) { throw "Expected exactly one retained setup" }
          $expected = ((Get-Content -Raw ($setup[0].FullName + '.sha256')).Trim() -split '\s+')[0]
          if ($expected -notmatch '^[0-9a-fA-F]{64}$' -or (Get-FileHash $setup[0].FullName -Algorithm SHA256).Hash -ne $expected) { throw "Setup checksum mismatch" }
          Write-Host "Replaying original RC $($run.head_sha) with current gate code; this does not produce a release candidate."
          "REPLAY_SETUP=$($setup[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run unchanged safety criteria against retained setup
        shell: pwsh
        run: |
          & ./installers/windows/gates.ps1 -Setup $env:REPLAY_SETUP -EvidenceDir (Join-Path $env:RUNNER_TEMP "WG-inst-evidence-replay")
          if (-not $?) { throw "Installer gate replay failed" }
      - name: Retain replay diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-replay
          path: ${{ runner.temp }}/WG-inst-evidence-replay
          if-no-files-found: warn
