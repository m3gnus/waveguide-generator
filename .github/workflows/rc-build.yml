name: RC build

# Build the installers WITHOUT spending anything: no tag, no draft, no
# release, no version bump — artifacts only. Exists for the hand-test gate in
# hornlab-policy/PLAN.md step 5: the maintainer tries a DMG and a Windows installer
# built from a release candidate before the version is pinned. The jobs are
# the release.yml bundle jobs minus the release guard and the publish job;
# assets are named by shared/version.json as it stands, so an RC built before
# phase 1 carries the previous version string — that is expected.
#
# Every action is pinned to an immutable commit, with the release it belonged to
# in a trailing comment. A major tag such as `@v4` moves, so a workflow that
# names one does not describe the code that ran: the inputs of a release build
# would be whatever those tags pointed at on the day. `scripts/tests/
# test_release_workflow.py` fails this file if a floating reference reappears,
# and rc-build.yml carries the same pins so a hand-tested candidate is built by
# the same actions as the release.
#
# What is still not pinned, stated rather than glossed over: the hosted runner
# images (`ubuntu-latest`, `macos-latest`, `windows-latest`, `ubuntu-24.04`)
# are rebuilt weekly by GitHub and carry no addressable identity a workflow can
# name. Four tools are pinned on top of them -- uv, the CPython standalone
# build, Node, Inno Setup -- and that is the list, not a summary of everything
# the build touches: the shell, tar, git, hdiutil, codesign, the system Python
# and the platform toolchains all arrive with the image at whatever version it
# carries that week. So this is meaningful drift reduction, and it is not a
# reproducible or authenticated toolchain; neither claim should be made from it.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to build (defaults to main's head)"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  spa:
    name: Build the SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: The Node the release was built with must be the pinned one
        # Drift detection, and only that. setup-node performs no digest check on
        # the archive it fetches from nodejs.org -- verified by reading its
        # distribution sources at the commit pinned above, which contain no
        # checksum code. This step does not close that: a substituted binary can
        # print any version it likes, so a version match is not authentication
        # of the bytes. What it does catch is the drift this pin exists for -- a
        # runner tool cache that answers a version spec differently, or a pin
        # that silently widens -- at the build rather than inside an artifact
        # nobody can date afterwards.
        #
        # Authenticating the Node download is possible and is NOT implemented
        # here: it would mean fetching the archive in this workflow and checking
        # it against a digest pinned in this repository. That is a real change
        # with its own review, not something this step should be read as having
        # done.
        run: |
          set -euo pipefail
          expected="v20.20.2"
          actual="$(node --version)"
          if [ "$actual" != "$expected" ]; then
            echo "Expected Node $expected, got $actual" >&2
            exit 1
          fi
          echo "Node $actual"
      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package and verify the SPA
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          archive="$(python -c 'import sys; from shared import release_assets; print(release_assets.spa_archive_name(sys.argv[1]))' "$version")"
          tar -czf "$archive" -C frontend dist
          sha256sum "$archive" > "$archive.sha256"
          echo "artifact=$archive" >> "$GITHUB_ENV"
          tar -tzf "$archive" | grep -Fx "dist/index.html"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-spa
          path: |
            ${{ env.artifact }}
            ${{ env.artifact }}.sha256
          if-no-files-found: error

  macos-bundle:
    name: Build the macOS standalone app
    runs-on: macos-latest
    needs: spa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-spa
          path: build/spa
      - name: Build and verify the standalone app
        run: |
          set -euo pipefail
          version="$(uv run --no-project --python 3.13.12 python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          spa="build/spa/update-spa-$version.tar.gz"
          test -f "$spa"
          test -f "$spa.sha256"
          uv run --no-project --python 3.13.12 scripts/build_bundle.py --spa "$spa" --output build/bundle
      - name: Share the canonical platform-neutral app layer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-app-layer
          path: |
            build/bundle/update-app-*.zip
            build/bundle/update-app-*.zip.sha256
            build/bundle/update-app-*.manifest.json
          if-no-files-found: error
      - name: Share the macOS RC assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-macos-dmg
          path: |
            build/bundle/Waveguide.Generator-*-macos-arm64.dmg
            build/bundle/Waveguide.Generator-*-macos-arm64.dmg.sha256
          if-no-files-found: error

      - name: Qualify BEAT CPU on the candidate extracted from the disk image
        # The build's own verification asks the backends whether they report
        # ready and asks the server for one HTTP response. Neither runs a BEAT
        # CPU solve, so a candidate could pass both while the backend the
        # product promises on GPU-less machines had never executed a frequency.
        #
        # The payload is the .app copied out of the mounted disk image with
        # ditto, so what is qualified is what a user drags out of the DMG --
        # not the build directory it came from.
        #
        # The application prepares its own CPU runtime on macOS too since
        # 69b1ed0, so this requires that preparation like every other platform
        # rather than reaching around it. It is the slow step here because that
        # preparation downloads and instantiates a Julia.
        #
        # After the uploads on purpose: a candidate that fails this gate is
        # still the candidate somebody has to look at, and the job goes red
        # either way.
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          echo "WG2_CPU_GATE_ROOT=$root" >> "$GITHUB_ENV"
          dmg="$(ls build/bundle/Waveguide.Generator-*-macos-arm64.dmg)"
          hdiutil attach "$dmg" -mountpoint "$root/mnt" -nobrowse -readonly -quiet
          ditto "$root/mnt/Waveguide Generator.app" "$root/Waveguide Generator.app"
          hdiutil detach "$root/mnt" -quiet
          manifest="$(ls build/bundle/update-app-*.manifest.json)"
          uv run --no-project --python 3.13.12 python scripts/qualify_installed_cpu.py \
            --payload "$root/Waveguide Generator.app" \
            --payload-kind dmg-ditto \
            --work "$root/work" \
            --output "$root/qualification" \
            --pins-json pins.json \
            --build-manifest "$manifest"

      - name: Preserve the CPU qualification logs
        if: always()
        # Into the job log rather than a new artifact: this workflow's artifact
        # set is the candidate a person hand-tests, and a gate's evidence should
        # not change what is offered for that.
        run: |
          set -u
          root="${WG2_CPU_GATE_ROOT:-}"
          if [ -z "$root" ] || [ ! -d "$root/qualification" ]; then
            echo "No qualification output was produced."
            exit 0
          fi
          for file in "$root/qualification"/*; do
            [ -f "$file" ] || continue
            echo "===== $(basename "$file") ====="
            tail -c 200000 "$file"
            echo
          done

  windows-bundle:
    name: Build the Windows standalone app
    runs-on: windows-latest
    needs: [spa, macos-bundle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-spa
          path: build/spa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standalone-app-layer
          path: build/app-reference
      - name: Install the pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey Inno Setup install exited $LASTEXITCODE"
          }
          # The helper uses bounded Program Files paths and the compiler's own
          # engine-version output while compiling a valid probe script.
          $iscc = & ./scripts/ci/verify_inno_setup.ps1
          "WG2_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and verify the standalone app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = uv run --no-project --python 3.13.12 python -c 'import json; print(json.load(open("shared/version.json"))["version"])'
          $spa = "build/spa/update-spa-$version.tar.gz"
          if (-not (Test-Path -LiteralPath $spa) -or -not (Test-Path -LiteralPath "$spa.sha256")) {
            throw "The verified SPA inputs are missing."
          }
          uv run --no-project --python 3.13.12 python scripts/build_bundle.py --platform windows --spa $spa --output build/bundle
      - name: Assert both platforms built the same app layer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $local = @(Get-ChildItem -File build/bundle/update-app-*.manifest.json)
          $reference = @(Get-ChildItem -File build/app-reference/update-app-*.manifest.json)
          if ($local.Count -ne 1 -or $reference.Count -ne 1) {
            throw "Expected exactly one local and one macOS-built app manifest."
          }
          $localTree = (Get-Content -Raw $local[0] | ConvertFrom-Json).treeSha256
          $referenceTree = (Get-Content -Raw $reference[0] | ConvertFrom-Json).treeSha256
          if (-not $localTree -or -not $referenceTree) {
            throw "An app manifest carries no treeSha256; the builder did not write one."
          }
          if ($localTree -ne $referenceTree) {
            throw "Windows and macOS app layers differ: $localTree != $referenceTree"
          }
          Write-Host "Cross-platform app layer treeSha256: $localTree"
      - name: Run setup-driven Windows installer gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setups = @(Get-ChildItem -File build/bundle/Waveguide.Generator-*-windows-x86_64-setup.exe)
          if ($setups.Count -ne 1) {
            throw "Expected exactly one Windows setup executable, found $($setups.Count)."
          }
          & ./installers/windows/gates.ps1 -Setup $setups[0].FullName
      - name: Share the Windows RC assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-windows-installer
          path: |
            build/bundle/Waveguide.Generator-*-windows-x86_64-setup.exe
            build/bundle/Waveguide.Generator-*-windows-x86_64-setup.exe.sha256
          if-no-files-found: error

      - name: Qualify BEAT CPU on the candidate the Windows installer installed
        shell: pwsh
        # Installed by the real installer, unattended and per-user: the .iss
        # sets PrivilegesRequired=lowest, so /DIR into a private directory needs
        # no elevation and touches nothing outside it. What is qualified is
        # therefore the installer's output, which is what a user receives.
        #
        # After the upload on purpose; see the macOS job.
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP ("cpu-gate-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $root | Out-Null
          "WG2_CPU_GATE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $setup = (Get-ChildItem -File build/bundle/Waveguide.Generator-*-windows-x86_64-setup.exe |
                    Select-Object -First 1).FullName
          $install = Join-Path $root "app"
          $installLog = Join-Path $root "inno-install.log"
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS",
            "/DIR=$install", "/LOG=$installLog"
          )
          if ($process.ExitCode -ne 0) {
            throw "The unattended installer exited $($process.ExitCode); see $installLog"
          }
          $manifest = (Get-ChildItem -File build/bundle/update-app-*.manifest.json |
                       Select-Object -First 1).FullName
          uv run --no-project --python 3.13.12 python scripts/qualify_installed_cpu.py `
            --payload $install `
            --payload-kind windows-installer `
            --work (Join-Path $root "work") `
            --output (Join-Path $root "qualification") `
            --pins-json pins.json `
            --build-manifest $manifest
          # PowerShell does not turn a native command's non-zero exit into a
          # terminating error: $ErrorActionPreference governs PowerShell errors,
          # not exit codes, so without this the qualifier could fail and the step
          # would still be green. The one thing this gate must never do.
          if ($LASTEXITCODE -ne 0) {
            throw "The CPU qualification exited $LASTEXITCODE"
          }

      - name: Preserve the CPU qualification logs
        if: always()
        shell: pwsh
        run: |
          $root = $env:WG2_CPU_GATE_ROOT
          if (-not $root -or -not (Test-Path -LiteralPath (Join-Path $root "qualification"))) {
            Write-Host "No qualification output was produced."
            exit 0
          }
          Get-ChildItem -File (Join-Path $root "qualification") | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content -Tail 4000 -LiteralPath $_.FullName
            Write-Host ""
          }

  linux-bundle:
    name: Build the Linux standalone app
    # Pinned to the distribution the build claims to support rather than
    # ubuntu-latest, so the glibc the runtime is linked against cannot move
    # under the release without anyone deciding to move it.
    runs-on: ubuntu-24.04
    needs: [spa, macos-bundle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
      - name: Install documented Linux runtime libraries for package qualification
        run: scripts/ci/install_linux_runtime_dependencies.sh
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-spa
          path: build/spa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standalone-app-layer
          path: build/app-reference
      - name: Build and verify the standalone app
        run: |
          set -euo pipefail
          version="$(uv run --no-project --python 3.13.12 python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          spa="build/spa/update-spa-$version.tar.gz"
          test -f "$spa"
          test -f "$spa.sha256"
          uv run --no-project --python 3.13.12 python scripts/build_bundle.py --platform linux --spa "$spa" --output build/bundle
      - name: Assert this platform built the same app layer
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json

          local = glob.glob("build/bundle/update-app-*.manifest.json")
          reference = glob.glob("build/app-reference/update-app-*.manifest.json")
          if len(local) != 1 or len(reference) != 1:
              raise SystemExit("Expected exactly one local and one macOS-built app manifest.")
          trees = [json.load(open(path))["treeSha256"] for path in (local[0], reference[0])]
          if not all(trees) or trees[0] != trees[1]:
              raise SystemExit(f"Linux and macOS app layers differ: {trees[0]} != {trees[1]}")
          print(f"Cross-platform app layer treeSha256: {trees[0]}")
          PY
      - name: Share the Linux RC assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-linux-tarball
          path: |
            build/bundle/Waveguide.Generator-*-linux-x86_64.tar.gz
            build/bundle/Waveguide.Generator-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

      - name: Qualify BEAT CPU on the candidate install.sh installed
        # Installed by the release tarball's own install.sh, as a non-root user
        # into a private prefix, so what is qualified is the installer's output.
        # --no-launch because this gate starts the server itself, with its own
        # isolated data directory, rather than qualifying whatever a desktop
        # session happened to open.
        #
        # After the upload on purpose; see the macOS job.
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          echo "WG2_CPU_GATE_ROOT=$root" >> "$GITHUB_ENV"
          tarball="$(ls build/bundle/Waveguide.Generator-*-linux-x86_64.tar.gz)"
          tar -xzf "$tarball" -C "$root"
          installer="$(find "$root" -maxdepth 2 -name install.sh -type f | head -n 1)"
          test -n "$installer"
          "$installer" --prefix "$root/prefix" --no-launch
          manifest="$(ls build/bundle/update-app-*.manifest.json)"
          uv run --no-project --python 3.13.12 python scripts/qualify_installed_cpu.py \
            --payload "$root/prefix/waveguide-generator" \
            --payload-kind linux-install-sh \
            --work "$root/work" \
            --output "$root/qualification" \
            --pins-json pins.json \
            --build-manifest "$manifest"

      - name: Preserve the CPU qualification logs
        if: always()
        # Into the job log rather than a new artifact: this workflow's artifact
        # set is the candidate a person hand-tests, and a gate's evidence should
        # not change what is offered for that.
        run: |
          set -u
          root="${WG2_CPU_GATE_ROOT:-}"
          if [ -z "$root" ] || [ ! -d "$root/qualification" ]; then
            echo "No qualification output was produced."
            exit 0
          fi
          for file in "$root/qualification"/*; do
            [ -f "$file" ] || continue
            echo "===== $(basename "$file") ====="
            tail -c 200000 "$file"
            echo
          done
