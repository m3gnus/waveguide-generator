# PROPOSAL — this file is deliberately NOT under .github/workflows/.
#
# GitHub only registers workflows inside .github/workflows, so nothing here has
# a trigger, a token or a permission until someone moves it there. Moving it is
# two separate authorizations under hornlab-policy/GIT-WORKFLOW.md: §1.2.5 for a
# workflow that requests `contents: write`, and §1.2.3 for the releases it then
# publishes. Read docs/reference/UPDATE-CHANNELS.md first; this file is the
# mechanics of the design described there.
#
# It is a complete graph, not a sketch: every job it names exists here, and
# `scripts/tests/test_main_build_proposal.py` holds it to that, to the artifact
# names it passes between jobs, to the asset names `shared/release_assets.py`
# actually produces, and to the flags the builder actually accepts.
#
# What it does: builds every installer from a commit on main, exactly as
# rc-build.yml already does, and publishes them as an immutable pre-release so
# the in-app beta channel can install one. No tag is ever moved or deleted, no
# signing identity is introduced, and the updater's trusted origins are
# untouched — the assets are ordinary release downloads of this repository.

name: Main build

on:
  # Deliberately dispatch-only, even after activation. `push: [main]` is a
  # second decision, and UPDATE-CHANNELS.md's disposition depends on being able
  # to bound how many live pre-releases exist while installs already in the
  # field still resolve the update companion by scanning 20 recent releases.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to build and publish"
        required: false
        default: "main"

# Every action is pinned to a digest, and Node to an exact patch, matching the
# refs `.github/workflows/rc-build.yml` carries. Be precise about what that
# buys: a fixed ref detects **tool drift** -- the build is the build that was
# reviewed, and a tag repointed underneath it cannot change what runs. It is
# NOT publisher authentication of anything this workflow produces. WG's own
# artifacts are unsigned here exactly as they are for a release, and whether
# that is acceptable for a channel that installs more often is a separate,
# open, owner decision. See docs/reference/UPDATE-CHANNELS.md.

permissions:
  contents: read

jobs:
  identity:
    name: Resolve the commit and name the build
    runs-on: ubuntu-latest
    outputs:
      # The commit, resolved ONCE. Every later job checks out this SHA rather
      # than the ref: `main` can move while a build is running, and a run that
      # built three platforms from three different commits would publish an
      # installer set that never existed as one tree.
      source: ${{ steps.resolve.outputs.source }}
      version: ${{ steps.resolve.outputs.version }}
      tag: v${{ steps.resolve.outputs.version }}
      updates_tag: v${{ steps.resolve.outputs.version }}-updates
      # Fixed for every job, so the stamp commit is byte-identical on all three
      # platforms and the app manifests agree on `commit` as well as on
      # `treeSha256`.
      stamp_date: ${{ steps.resolve.outputs.stamp_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
      - id: resolve
        name: Next patch, plus a monotonic main label
        run: |
          set -euo pipefail
          source="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$source" origin/main 2>/dev/null \
            || git fetch --no-tags --depth=100 origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source" origin/main
          # NOT shared/version.json as it stands: a pre-release sorts BELOW the
          # release sharing its core numbers, so a build named from the current
          # version is older than the installed copy and reads as "ahead".
          # github.run_number never repeats and never goes backwards, so every
          # build outranks the last, and the next real release outranks all of
          # them.
          base="$(python -c 'import json;print(json.load(open("shared/version.json"))["version"])')"
          next="$(python - "$base" <<'PY'
          import sys
          major, minor, patch = (int(part) for part in sys.argv[1].split("."))
          print(f"{major}.{minor}.{patch + 1}")
          PY
          )"
          {
            echo "source=$source"
            echo "version=$next-main.${{ github.run_number }}"
            echo "stamp_date=$(git show -s --format=%cI "$source")"
          } >> "$GITHUB_OUTPUT"

  spa:
    name: Build the SPA
    runs-on: ubuntu-latest
    needs: identity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.source }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The stamp comes before `npm ci`: the SPA compiles __WG2_VERSION__ from
      # package.json, so a build stamped afterwards would report the last
      # release from inside the running application.
      #
      # It is also the first thing this job runs, on a runner with nothing
      # installed but its host Python -- which is why `bump_version.py` reaches
      # every copy of the version itself, including the OpenAPI snapshot's
      # `info.version`, and imports nothing outside the standard library.
      # Regenerating that snapshot needs FastAPI and the rest of the server, so
      # a stamp that called `gen_openapi.py` would need the whole dependency set
      # installed on all four runners before the version was even decided.
      # `scripts/tests/test_main_build_proposal.py` runs these exact commands
      # with site-packages disabled, in a fresh checkout, so "it runs on a clean
      # runner" is checked rather than assumed.
      - name: Stamp this build's identity
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          GIT_AUTHOR_DATE: ${{ needs.identity.outputs.stamp_date }}
          GIT_COMMITTER_DATE: ${{ needs.identity.outputs.stamp_date }}
        run: |
          set -euo pipefail
          python scripts/bump_version.py --build-stamp --set "$VERSION"
          python scripts/bump_version.py --check --build-stamp
          git -c user.name=m-a -c user.email=m3gnus@users.noreply.github.com \
            commit -aqm "Build stamp $VERSION" --no-gpg-sign
      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package and verify the SPA
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          archive="$(python -c 'import sys; from shared import release_assets; print(release_assets.spa_archive_name(sys.argv[1]))' "$version")"
          tar -czf "$archive" -C frontend dist
          sha256sum "$archive" > "$archive.sha256"
          echo "artifact=$archive" >> "$GITHUB_ENV"
          tar -tzf "$archive" | grep -Fx "dist/index.html"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-spa
          path: |
            ${{ env.artifact }}
            ${{ env.artifact }}.sha256
          if-no-files-found: error

  macos-bundle:
    name: Build the macOS standalone app
    runs-on: macos-latest
    needs: [identity, spa]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.source }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-spa
          path: build/spa
      # Identical to the SPA job's stamp, with the same fixed dates, so this
      # commit has the same SHA on every platform. build_bundle materializes
      # the app layer from Git blobs and refuses a dirty worktree: the commit
      # is what carries the version into the packaged app at all.
      - name: Stamp this build's identity
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          GIT_AUTHOR_DATE: ${{ needs.identity.outputs.stamp_date }}
          GIT_COMMITTER_DATE: ${{ needs.identity.outputs.stamp_date }}
        run: |
          set -euo pipefail
          python scripts/bump_version.py --build-stamp --set "$VERSION"
          python scripts/bump_version.py --check --build-stamp
          git -c user.name=m-a -c user.email=m3gnus@users.noreply.github.com \
            commit -aqm "Build stamp $VERSION" --no-gpg-sign
      - name: Build and verify the standalone app
        env:
          SOURCE: ${{ needs.identity.outputs.source }}
        run: |
          set -euo pipefail
          version="$(uv run --no-project --python 3.13.12 python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          spa="build/spa/update-spa-$version.tar.gz"
          test -f "$spa"
          test -f "$spa.sha256"
          uv run --no-project --python 3.13.12 scripts/build_bundle.py \
            --spa "$spa" --output build/bundle --source-commit "$SOURCE"
      - name: Share the canonical platform-neutral app layer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-app-layer
          path: |
            build/bundle/update-app-*.zip
            build/bundle/update-app-*.zip.sha256
            build/bundle/update-app-*.manifest.json
          if-no-files-found: error
      - name: Share the macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-macos
          path: |
            build/bundle/Waveguide.Generator-*-macos-arm64.dmg
            build/bundle/Waveguide.Generator-*-macos-arm64.dmg.sha256
            build/bundle/update-runtime-macos-arm64-*.zip
            build/bundle/update-runtime-macos-arm64-*.zip.sha256
          if-no-files-found: error

  windows-bundle:
    name: Build the Windows standalone app
    runs-on: windows-latest
    needs: [identity, spa, macos-bundle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.source }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-spa
          path: build/spa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-app-layer
          path: build/app-reference
      - name: Stamp this build's identity
        shell: pwsh
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          GIT_AUTHOR_DATE: ${{ needs.identity.outputs.stamp_date }}
          GIT_COMMITTER_DATE: ${{ needs.identity.outputs.stamp_date }}
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/bump_version.py --build-stamp --set $env:VERSION
          python scripts/bump_version.py --check --build-stamp
          git -c user.name=m-a -c user.email=m3gnus@users.noreply.github.com commit -aqm "Build stamp $env:VERSION" --no-gpg-sign
      - name: Install the pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --version=6.7.1 -y --no-progress
          # The helper uses bounded Program Files paths and the compiler's PE
          # FileVersion resource. ISCC /? prints usage without the patch.
          $iscc = & ./scripts/ci/verify_inno_setup.ps1
          "WG2_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The installer's VersionInfoVersion is a binary field that takes only
      # numbers, which is why build_bundle passes it the numeric form of this
      # version rather than the version string. Without that, ISCC refuses to
      # compile a pre-release build at all.
      - name: Build and verify the standalone app
        shell: pwsh
        env:
          SOURCE: ${{ needs.identity.outputs.source }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = uv run --no-project --python 3.13.12 python -c 'import json; print(json.load(open("shared/version.json"))["version"])'
          $spa = "build/spa/update-spa-$version.tar.gz"
          if (-not (Test-Path -LiteralPath $spa) -or -not (Test-Path -LiteralPath "$spa.sha256")) {
            throw "The verified SPA inputs are missing."
          }
          uv run --no-project --python 3.13.12 python scripts/build_bundle.py --platform windows --spa $spa --output build/bundle --source-commit $env:SOURCE
      - name: Assert both platforms built the same app layer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $local = @(Get-ChildItem -File build/bundle/update-app-*.manifest.json)
          $reference = @(Get-ChildItem -File build/app-reference/update-app-*.manifest.json)
          if ($local.Count -ne 1 -or $reference.Count -ne 1) {
            throw "Expected exactly one local and one macOS-built app manifest."
          }
          $localTree = (Get-Content -Raw $local[0] | ConvertFrom-Json).treeSha256
          $referenceTree = (Get-Content -Raw $reference[0] | ConvertFrom-Json).treeSha256
          if (-not $localTree -or -not $referenceTree) {
            throw "An app manifest carries no treeSha256; the builder did not write one."
          }
          if ($localTree -ne $referenceTree) {
            throw "Windows and macOS app layers differ: $localTree != $referenceTree"
          }
          Write-Host "Cross-platform app layer treeSha256: $localTree"
      - name: Share the Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-windows
          path: |
            build/bundle/Waveguide.Generator-*-windows-x86_64-setup.exe
            build/bundle/Waveguide.Generator-*-windows-x86_64-setup.exe.sha256
            build/bundle/Waveguide.Generator-*-windows-x86_64.zip
            build/bundle/Waveguide.Generator-*-windows-x86_64.zip.sha256
            build/bundle/update-runtime-windows-x86_64-*.zip
            build/bundle/update-runtime-windows-x86_64-*.zip.sha256
          if-no-files-found: error

  linux-bundle:
    name: Build the Linux standalone app
    # Pinned to the distribution the build claims to support rather than
    # ubuntu-latest, so the glibc the runtime is linked against cannot move
    # under the build without anyone deciding to move it.
    runs-on: ubuntu-24.04
    needs: [identity, spa, macos-bundle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.source }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-spa
          path: build/spa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-build-app-layer
          path: build/app-reference
      - name: Stamp this build's identity
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          GIT_AUTHOR_DATE: ${{ needs.identity.outputs.stamp_date }}
          GIT_COMMITTER_DATE: ${{ needs.identity.outputs.stamp_date }}
        run: |
          set -euo pipefail
          python scripts/bump_version.py --build-stamp --set "$VERSION"
          python scripts/bump_version.py --check --build-stamp
          git -c user.name=m-a -c user.email=m3gnus@users.noreply.github.com \
            commit -aqm "Build stamp $VERSION" --no-gpg-sign
      - name: Build and verify the standalone app
        env:
          SOURCE: ${{ needs.identity.outputs.source }}
        run: |
          set -euo pipefail
          version="$(uv run --no-project --python 3.13.12 python -c 'import json; print(json.load(open("shared/version.json"))["version"])')"
          spa="build/spa/update-spa-$version.tar.gz"
          test -f "$spa"
          test -f "$spa.sha256"
          uv run --no-project --python 3.13.12 python scripts/build_bundle.py \
            --platform linux --spa "$spa" --output build/bundle --source-commit "$SOURCE"
      - name: Assert this platform built the same app layer
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json

          local = glob.glob("build/bundle/update-app-*.manifest.json")
          reference = glob.glob("build/app-reference/update-app-*.manifest.json")
          if len(local) != 1 or len(reference) != 1:
              raise SystemExit("Expected exactly one local and one macOS-built app manifest.")
          trees = [json.load(open(path))["treeSha256"] for path in (local[0], reference[0])]
          if not all(trees) or trees[0] != trees[1]:
              raise SystemExit(f"Linux and macOS app layers differ: {trees[0]} != {trees[1]}")
          print(f"Cross-platform app layer treeSha256: {trees[0]}")
          PY
      - name: Share the Linux assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-build-linux
          path: |
            build/bundle/Waveguide.Generator-*-linux-x86_64.tar.gz
            build/bundle/Waveguide.Generator-*-linux-x86_64.tar.gz.sha256
            build/bundle/update-runtime-linux-x86_64-*.zip
            build/bundle/update-runtime-linux-x86_64-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish an immutable main build
    needs: [identity, spa, macos-bundle, windows-bundle, linux-bundle]
    runs-on: ubuntu-latest
    permissions:
      # <-- The authorization. GIT-WORKFLOW.md §1.2.5; this is exactly why the
      #     file is not a workflow yet.
      contents: write
    env:
      # `gh` needs to know both the repository and the commit it is releasing
      # from. GH_REPO makes every command below explicit rather than dependent
      # on the checkout it happens to be standing in.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.identity.outputs.version }}
      SOURCE: ${{ needs.identity.outputs.source }}
      TAG: ${{ needs.identity.outputs.tag }}
      UPDATES_TAG: ${{ needs.identity.outputs.updates_tag }}
    steps:
      # A checkout, so `shared/release_assets.py` names the assets here rather
      # than a second copy of those names living in this file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.source }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build/artifacts
      - name: Sort the assets into the two releases
        run: |
          set -euo pipefail
          mkdir -p build/downloads build/layers
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          from shared import release_assets

          version = os.environ["VERSION"]
          staged = sorted(Path("build/artifacts").rglob("*"))
          wanted = set(release_assets.user_download_names(version))
          downloads, layers = Path("build/downloads"), Path("build/layers")
          for path in staged:
              if not path.is_file():
                  continue
              target = downloads if path.name in wanted else layers
              shutil.copy2(path, target / path.name)
          missing = wanted - {path.name for path in downloads.iterdir()}
          if missing:
              raise SystemExit(f"The build produced no {sorted(missing)}")
          print("downloads:", sorted(path.name for path in downloads.iterdir()))
          print("layers:", sorted(path.name for path in layers.iterdir()))
          PY
      - name: Publish, as a pre-release, once
        run: |
          set -euo pipefail
          # `--prerelease` is what keeps this off the stable channel:
          # releases/latest never returns one, so no stable install can be
          # offered a main build. Re-check that property before changing this.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. A build is never republished." >&2
            exit 1
          fi
          # The companion first, so the layers exist before anything can look
          # for them -- the order release.yml publishes in, for the same reason.
          gh release create "$UPDATES_TAG" \
            --target "$SOURCE" \
            --prerelease \
            --title "main build $VERSION layers" \
            --notes "Update layers for $TAG. Not a release." \
            build/layers/*
          gh release create "$TAG" \
            --target "$SOURCE" \
            --prerelease \
            --title "main build $VERSION" \
            --notes "Automatic build of main@$SOURCE. Not a release." \
            build/downloads/*
      # No cleanup step, deliberately. Deleting an older main build would delete
      # a published tag (§1.2.1) and would be the tag mutation this design
      # exists to avoid. If live pre-releases have to be bounded for installs
      # already in the field, bound how often this workflow runs — see
      # UPDATE-CHANNELS.md, "Old-client compatibility".
