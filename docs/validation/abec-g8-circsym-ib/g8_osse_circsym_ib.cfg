; G8 external reference fixture -- axisymmetric OS-SE waveguide, flush mounted
; in an infinite baffle, solved by ABEC3 in CircSym mode.
;
; Axisymmetric by construction: a single coverage angle and no azimuth-dependent
; term, so every meridian profile is identical and the device is a body of
; revolution. ABEC.SimProfile selects profile 0 for the CircSym analysis.
;
; Ath version V2025-06

; -- geometry: OS-SE, circular ------------------------------------------------
Throat.Diameter = 25.4
Throat.Angle = 10
Throat.Profile = 1
Coverage.Angle = 45
Length = 120
OS.k = 1

; CircSym ignores the 3D mesh resolution items; this one still controls the
; number of profile points, i.e. the polyline ABEC subdivides.
Mesh.LengthSegments = 120
Term.s = 0.6
Term.n = 4
Term.q = 0.98

; -- analysis ------------------------------------------------------------------
Output.ABECProject = 1
Output.STL = 0

ABEC.SimType = 1        ; 1 = infinite baffle
ABEC.SimProfile = 0     ; CircSym analysis on profile 0
ABEC.f1 = 200
ABEC.f2 = 20000
ABEC.NumFrequencies = 100
ABEC.MeshFrequency = 40000   ; ATH's guidance for a 20 kHz CircSym analysis

ABEC.Polars:SPL = {
MapAngleRange = 0,90,19
NormAngle = 0
Distance = 2
Offset = 120           ; ATH clamps this to the mouth plane at z = Length
}

Output.DestDir = "C:\Users\Docker\AppData\Local\Temp\claude\C--Users-Docker-Desktop-Hornlab---Workspace\cf3a8134-ea25-446b-89d3-ff2077e83c76\scratchpad\g8\out"
