[pytest]
# A hang is not a failure. pytest waits on it forever, the CI job holds its
# runner until something else cancels the run, and the log ends mid-test with no
# summary and nothing named -- Server (windows-latest) burned two 2h+ runs that
# way on 2026-08-24. faulthandler turns that into a stack dump that names the
# blocked frame directly.
#
# exit_on_timeout is the half that matters on a runner: the default is false, so
# pytest dumps the traceback and then goes straight back to blocking, which on
# Windows also leaves an orphaned python.exe holding the working tree. This is a
# backstop for the next hang nobody predicted, not a per-test budget -- 300s is
# far above the slowest legitimate test in this suite, whose whole run finishes
# in about five minutes.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
