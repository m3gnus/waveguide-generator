<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Waveguide Generator v2</title>
    <style>
      :root {
        --parchment: #f3ead2;
        --parchment-shadow: #d8c79f;
        --ink: #30291f;
        --accent: #8b5638;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--ink);
        background: var(--parchment);
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        padding: 3rem;
        border: 1px solid var(--parchment-shadow);
        box-shadow: 0 1rem 3rem rgb(48 41 31 / 12%);
        text-align: center;
      }
      h1 { margin: 0; color: var(--accent); font-size: clamp(1.5rem, 4vw, 2.5rem); }
    </style>
  </head>
  <body>
    <main><h1>Waveguide Generator v2 — shell under construction</h1></main>
  </body>
</html>
