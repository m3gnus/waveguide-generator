[mypy]
python_version = 3.13
explicit_package_bases = True
strict = True
# Phase one checks these boundaries with installed runtime dependency types.
# Imports supply inference, but errors outside this explicit scope are deferred.
# No project-wide ignore_errors baseline is used.
follow_imports = silent
files = shared/safe_names.py, shared/runtime_id.py, shared/release_assets.py, server/jobs/models.py, server/mesh/artifact.py, server/solver/metal_permit.py

# The installed catalog owner has annotations but no package-wide PEP561 marker.
# Follow this module's types at the checked options boundary; do not suppress it.
[mypy-hornlab_mesher.controls]
follow_untyped_imports = True
